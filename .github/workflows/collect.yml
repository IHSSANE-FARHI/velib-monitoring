name: collecte-velib

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: collecte-velib
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python ingestion/collect.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DUREE_MINUTES: "130"
          INTERVALLE_SECONDES: "300"
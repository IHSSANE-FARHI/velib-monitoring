name: dbt-build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: dbt-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: velib_dbt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install dbt-core dbt-postgres

      - name: Generer le profil dbt depuis le secret
        working-directory: .
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ci/make_profiles.py

      - run: dbt deps

      - name: Construire les modeles et jouer les tests
        run: dbt build

      - name: Verifier la fraicheur de la source
        run: dbt source freshness
version: 2

models:
  - name: stg_station_status
    description: "Etat nettoye de chaque station a chaque releve."
    columns:
      - name: snapshot_ts
        data_tests: [not_null]
      - name: station_id
        data_tests: [not_null]
      - name: velos_disponibles
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

  - name: stg_station
    description: "Une ligne par station : nom, position, capacite."
    columns:
      - name: station_id
        data_tests: [unique, not_null]
      - name: nom_station
        data_tests: [not_null]
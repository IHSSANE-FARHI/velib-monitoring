version: 2

models:
  - name: dim_station
    description: "Dimension station : une ligne par station."
    columns:
      - name: station_id
        data_tests: [unique, not_null]
      - name: nom_station
        data_tests: [not_null]

  - name: fct_station_heure
    description: "Taux de rupture par station et par heure, en proportion de releves."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [station_id, heure]
    columns:
      - name: station_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_id
      - name: heure
        data_tests: [not_null]
      - name: taux_rupture_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: taux_vide_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: taux_pleine_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true

  - name: fct_episode_rupture
    description: "Un episode = une serie consecutive de releves en rupture, coupee sur les trous de collecte."
    columns:
      - name: station_id
        data_tests: [not_null]
      - name: type_rupture
        data_tests:
          - accepted_values:
              arguments:
                values: ['vide', 'pleine']
      - name: duree_minutes
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true